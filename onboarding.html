<!doctype html><html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>NOVA — Onboarding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css" /></head><body>
<div class="bg-grid"></div><header class="topbar"><div class="brand">NOVA <span>Finance OS</span></div><nav class="topnav"><a href="index.html">Inicio</a><a href="onboarding.html">Onboarding</a><a href="dashboard.html">Dashboard</a><a href="deudas.html">Deudas</a><a href="ahorro.html">Ahorro</a><a href="inversion.html">Inversión</a></nav><div class="currency-switcher"><label for="currency">Divisa</label><select id="currency"><option>USD</option><option>EUR</option><option>MXN</option><option>COP</option></select></div></header>
<main class="section"><h1 class="page-title">Onboarding financiero</h1><form id="onboarding-form" class="panel"><div class="grid-2"><div class="field"><label>Ingreso mensual</label><input name="income" type="number" value="2500"></div><div class="field"><label>Gastos esenciales</label><input name="essentials" type="number" value="1500"></div><div class="field"><label>¿Tienes deudas?</label><select name="hasDebt"><option value="yes">Sí</option><option value="no">No</option></select></div><div class="field"><label>Pago mínimo deuda</label><input name="debtMin" type="number" value="220"></div><div class="field"><label>Fondo emergencia actual</label><input name="emergency" type="number" value="300"></div><div class="field"><label>Meta fondo (meses)</label><select name="emergencyMonths"><option value="3">3</option><option value="6">6</option></select></div><div class="field"><label>Meta nombre</label><input name="goalName" value="Viaje"></div><div class="field"><label>Monto meta</label><input name="goalAmount" type="number" value="2000"></div><div class="field"><label>Perfil riesgo</label><select name="risk"><option value="conservative">Conservador</option><option value="balanced" selected>Balanceado</option><option value="growth">Crecimiento</option></select></div></div><button class="btn" type="submit">Guardar y ver dashboard</button></form></main>
<script src="script.js"></script></body></html>
